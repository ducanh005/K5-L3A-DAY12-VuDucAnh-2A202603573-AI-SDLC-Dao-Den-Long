name: Verify Dao Den Long (Linux Headless & Build)

on:
  push:
    branches: [main]
    tags: ['phase-*', 'v*']
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify typecheck, unit tests, and headless determinism
        run: npm run verify

      - name: Build production static bundle
        run: npm run build
